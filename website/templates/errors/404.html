{% load static %}
<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Halaman Tidak Ditemukan</title>
    <style>
      :root { --primary:#2781da; --text:#0f172a; --muted:#64748b; }
      *{box-sizing:border-box} body{margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; color:var(--text);}
      .wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; background:#f8fafc;}
      .card{width:min(720px,100%); background:#fff; border:1px solid #eef2f7; border-radius:16px; padding:28px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.06);} 
      .card h1{margin:8px 0 6px; font-size: clamp(24px, 4vw, 40px);} 
      .muted{color:var(--muted);} .actions{display:flex; gap:10px; justify-content:center; margin-top:14px}
      .btn{appearance:none; border:1px solid #e5e7eb; padding:10px 16px; border-radius:10px; background:#fff; color:#334155; cursor:pointer}
      .btn.primary{background:var(--primary); border-color:var(--primary); color:#fff}
      img{max-width:260px}
      code{background:#f1f5f9; padding:2px 6px; border-radius:6px}
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="card">
        <div class="mb-3">
          <img src="{% static 'assets/img/portofolio/404.png' %}" alt="404 Not Found" onerror="this.style.display='none'">
        </div>
        <h1>Halaman Tidak Ditemukan</h1>
        <p class="muted">URL <code>{{ path }}</code> tidak tersedia atau telah dipindahkan.</p>
        <div class="actions">
          <a class="btn primary" href="/">Kembali ke Beranda</a>
          <button class="btn" onclick="history.back()">Kembali</button>
        </div>
      </div>
    </main>
  </body>
  </html>
