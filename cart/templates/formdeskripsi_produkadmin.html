{% extends "baseadmin.html" %}
{% load static %}
{% block content %}
<div class="flex-1 p-6 transition-all duration-200 ease-in-out">
    <header class="mb-8">
        <h1 class="text-3xl font-bold text-gray-700">Tambah Deskripsi Produk</h1>
    </header>
    <div class="bg-white shadow rounded-lg p-6">
        <form action="" method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_kategoripenjualan" class="block text-gray-700 font-bold mb-2">Kategori Penjualan:</label>
                {{ form.kategoripenjualan }}
            </div>
            <div class="mb-4">
                <label for="id_nama" class="block text-gray-700 font-bold mb-2">Nama Produk:</label>
                {{ form.nama }}
            </div>
            <div class="mb-4">
                <label for="id_deskripsi" class="block text-gray-700 font-bold mb-2">Deskripsi:</label>
                {{ form.deskripsi }}
            </div>
            <div class="mb-4">
                <label for="id_harga" class="block text-gray-700 font-bold mb-2">Harga:</label>
                {{ form.harga }}
            </div>
            <div class="mb-4">
                <label for="id_gambar" class="block text-gray-700 font-bold mb-2">Gambar 1:</label>
                {{ form.gambar }}
            </div>
            <div class="mb-4">
                <label for="id_gambar2" class="block text-gray-700 font-bold mb-2">Gambar 2:</label>
                {{ form.gambar2 }}
            </div>
            <div class="mb-4">
                <label for="id_gambar3" class="block text-gray-700 font-bold mb-2">Gambar 3:</label>
                {{ form.gambar3 }}
            </div>
            <div class="mb-4">
                <label for="id_aktif" class="block text-gray-700 font-bold mb-2">Aktif:</label>
                {{ form.aktif }}
            </div>
            <div class="flex justify-end">
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Simpan
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
